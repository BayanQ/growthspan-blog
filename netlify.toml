# Netlify build configuration
[build]
  command = "npm install && npm run build"
  publish = "public"

[build.environment]
  # CVE-2026-111497 ("Node2Shell"): OOB write in Node's bundled Brotli
  # decoder, CVSS v4.0 9.2 CRITICAL, fixed upstream in v22.23.4.
  NODE_VERSION = "22.23.4"

# Branch deploy configuration
[context.staging]
  command = "npm install && npm run build"

[context.branch-deploy]
  command = "npm install && npm run build"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
